coil = { module = "io.coil-kt.coil3:coil-compose", version = "3.3.0" }
coil-network = { module = "io.coil-kt.coil3:coil-network-okhttp", version = "3.3.0" }
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
hilt-compose = { module = "androidx.hilt:hilt-lifecycle-viewmodel-compose", version = "1.3.0" }
hilt-work = { module = "androidx.hilt:hilt-work", version = "1.3.0" }
hilt-work-compiler = { module = "androidx.hilt:hilt-compiler", version = "1.3.0" }
[plugins]
iu3-android-application = { id = "iu3.android.application" }
iu3-android-library = { id = "iu3.android.library" }
iu3-android-api = { id = "iu3.android.api" }
iu3-android-feature = { id = "iu3.android.feature" }
iu3-android-compose = { id = "iu3.android.compose" }
iu3-android-hilt = { id = "iu3.android.hilt" }
iu3-android-serialization = { id = "iu3.android.serialization" }
